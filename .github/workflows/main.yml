name: Update Schedule
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch and Save Data
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          curl --request GET \
            --url 'https://sofascore.p.rapidapi.com/tournaments/get-scheduled-events?categoryId=1' \
            --header 'x-rapidapi-host: sofascore.p.rapidapi.com' \
            --header "x-rapidapi-key: $RAPIDAPI_KEY" \
            -o schedule.json
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add schedule.json
          git commit -m "Update match schedule" || exit 0
          git push
