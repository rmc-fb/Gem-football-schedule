name: Update Schedule
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch and Save Data
        run: |
          curl -f -o schedule.json "https://api.apify.com/v2/datasets/【あなたのデータセットID】/items?token=${{ secrets.APIFY_TOKEN }}"
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add schedule.json
          git commit -m "Update match schedule" || exit 0
          git push
