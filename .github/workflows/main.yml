name: Update Schedule
on:
  schedule:
    - cron: '0 0 * * *' # 毎日0時に自動実行
  workflow_dispatch:      # 手動でも実行できるようにする

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Fetch and Save Data
        run: |
          # ここにApifyのデータを取得するURLを入れる（後で設定します）
          curl "https://api.apify.com/v2/datasets/【ここにあなたのデータセットID】/items?token=【あなたのトークン】" > schedule.json
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add schedule.json
          git commit -m "Update match schedule"
          git push
