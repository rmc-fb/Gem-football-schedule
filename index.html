<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #111625; color: #ffffff; }
    header { padding: 30px 20px 15px 20px; max-width: 500px; margin: 0 auto; text-align: left; }
    
    /* タイトル周りの調整（文字サイズを大きく） */
    .site-title-container { display: flex; align-items: center; gap: 10px; }
    .site-logo-img { width: 26px; height: 26px; fill: #ffffff; flex-shrink: 0; }
    .site-title { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: 0.5px; white-space: nowrap; }
    .site-title a { color: #ffffff; text-decoration: none; }
    
    /* サブタイトルを「O」の下に配置 */
    .site-subtitle { margin: 6px 0 0 36px; color: #64748b; font-size: 13px; font-weight: 500; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 0 16px 50px; box-sizing: border-box; }
    
    /* 2行カテゴリタブ（高さを抑えた設定） */
    .category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 14px; }
    .category-tabs button { background: #161c2e; border: none; color: #94a3b8; padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; }
    .category-tabs button.active { background: #1e2942; color: #ffffff; border-bottom: 2px solid #ef4444; border-radius: 4px 4px 0 0; }
    
    /* 男女、検索、リセットを横1行にまとめるスタイル */
    .controls-row { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; width: 100%; }
    
    .gender-tabs { display: flex; background: #161c2e; padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .gender-tabs button { background: none; border: none; color: #94a3b8; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .gender-tabs button.active { background: #ef4444; color: #fff; border-radius: 2px; }
    
    .league-controls { flex: 1; min-width: 0; }
    .league-controls select { width: 100%; background: #161c2e; border: 1px solid #232d45; color: #fff; padding: 5px; border-radius: 4px; font-weight: 600; font-size: 12px; outline: none; box-sizing: border-box; }
    
    .btn-reset { background: #161c2e; border: 1px solid #232d45; color: #475569; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12px; flex-shrink: 0; }
    
    /* 日付ヘッダー */
    .date-header { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 6px 0; font-size: 13px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    .match-count { color: #475569; font-size: 11px; font-weight: 500; }
    
    /* 試合カード（上下4px、左右8pxの超コンパクト設定） */
    .match-card { background: #161c2e; border: 1px solid #1e263f; border-radius: 4px; padding: 4px 8px; margin-bottom: 4px; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: all 0.2s; }
    .match-card.is-japan { border: 1px solid #3b82f6; background: #151b2b; }
    
    .match-main { display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden; width: 100%; }
    .match-time { font-weight: 700; width: 40px; color: #ffffff; font-size: 12px; flex-shrink: 0; }
    .match-badge { font-size: 9px; font-weight: 800; padding: 1px 4px; border-radius: 3px; margin-right: 8px; text-align: center; min-width: 35px; color: #ffffff; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .match-teams { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; gap: 4px; white-space: nowrap; overflow: hidden; }
    .team { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team.home { justify-content: flex-end; flex: 1; text-align: right; }
    .team.away { justify-content: flex-start; flex: 1; text-align: left; }
    .vs { color: #475569; font-size: 10px; font-weight: 500; margin: 0 2px; flex-shrink: 0; }
    
    /* 選手名タグ */
    .player-tag-wrapper { display: flex; justify-content: flex-end; width: 100%; margin-top: 1px; }
    .player-tag { background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #60a5fa; font-size: 9px; font-weight: 700; padding: 0 6px; border-radius: 10px; }

    /* フッター */
    footer { text-align: center; color: #475569; font-size: 11px; line-height: 1.8; margin-top: 40px; padding: 20px 0; border-top: 1px solid #161c2e; }
  </style>
</head>
<body>

<header>
  <div class="site-title-container">
    <svg class="site-logo-img" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0zM358.5 220.8l-40.4 124.3H193.9l-40.4-124.3 98.4-71.5 106.6 71.5zM224 53.6l76.7 54.4-69 50.1-68.9-50.1L224 53.6zM69.6 150.1l90.3 65.7-34.5 106.1-94.8-19.1C44.7 266 36.6 226.7 36.6 186.7c0-12.7 1-25 2.8-37.1l30.2.5zM83.8 387c22.5 32 52.8 57.6 88 74.3l-26.6-81.8-61.4 7.5zM340 379.5l-26.6 81.8c35.3-16.7 65.5-42.3 88-74.3l-61.4-7.5zM481.5 302.8l-94.8 19.1-34.5-106.1 90.3-65.7l30.2-.5c1.8 12.1 2.8 24.5 2.8 37.1 0 40.1-8.1 79.4-26 116.1z"/>
    </svg>
    <h1 class="site-title"><a href="https://rmc-fb.github.io/Gem-football-schedule">OVERSEAS FOOTBALL SCHEDULE</a></h1>
  </div>
  <p class="site-subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
</header>

<div class="container">
  <div class="category-tabs" id="tabs">
    <button onclick="updateState('europe')">🌏 欧州日程</button>
    <button onclick="updateState('japan')">🇯🇵 日本人日程</button>
    <button onclick="updateState('match')">🏆 代表戦日程</button>
    <button onclick="updateState('mideast')">🕌 中東日程</button>
    <button onclick="updateState('america')">🌎 北米日程</button>
    <button onclick="updateState('youth')">🌱 ユース代表</button>
  </div>

  <div class="controls-row">
    <div class="gender-tabs" id="gender-ui">
      <button id="men" class="active" onclick="setGender('men')">男子</button>
      <button id="women" onclick="setGender('women')">女子</button>
    </div>
    <div class="league-controls" id="league-ui">
      <select id="league-select" onchange="render()"></select>
    </div>
    <button class="btn-reset" id="reset-ui" onclick="resetFilters()">リセット</button>
  </div>

  <div id="display-area"></div>

  <footer>
    <p>© 2026 データは参考情報です。正確な日程は各クラブ公式サイトでご確認ください。<br>
    Powered by Gemini + GitHub + Rapid API</p>
  </footer>
</div>

<script>
  let state = { tab: 'europe', gender: 'men', league: 'all' };
  let loadedMatches = [];

  const leagueOptions = {
    europe: {
      men: [
        { val: 'all', text: 'リーグ検索' }, { val: 'premier', text: 'プレミアリーグ' }, { val: 'laliga', text: 'ラ・リーガ' },
        { val: 'bundes', text: 'ブンデスリーガ' }, { val: 'seriea', text: 'セリエA' }, { val: 'ligue1', text: 'リーグ・アン' },
        { val: 'eredivisie', text: 'エールディヴィジ' }, { val: 'belgium', text: 'ベルギーリーグ' }, { val: 'scottish', text: 'スコティッシュ' },
        { val: 'primeira', text: 'プリメイラリーガ' }, { val: 'championship', text: 'チャンピオンシップ' },
        { val: 'cl', text: 'チャンピオンズリーグ' }, { val: 'el', text: 'ヨーロッパリーグ' }, { val: 'ecl', text: 'カンファレンスリーグ' }
      ],
      women: [
        { val: 'all', text: 'リーグ検索' }, { val: 'wsl', text: 'WSL' }, { val: 'w_bundes', text: '女子ブンデス' },
        { val: 'w_cl', text: '女子CL' }, { val: 'w_d1', text: '女子D1' }
      ]
    },
    japan: {
      men: [{ val: 'all', text: 'リーグ検索' }],
      women: [{ val: 'all', text: 'リーグ検索' }]
    },
    mideast: [
      { val: 'all', text: 'リーグ検索' }, { val: 'saudi', text: 'サウジリーグ' }, { val: 'uae', text: 'UAEリーグ' }, { val: 'qatar', text: 'カタールリーグ' }
    ],
    america: {
      men: [{ val: 'all', text: 'リーグ検索' }, { val: 'mls', text: 'MLS' }],
      women: [{ val: 'all', text: 'リーグ検索' }, { val: 'mls', text: 'MLS' }]
    }
  };

  // チーム名の日本語化辞書
  const teamDictionary = {
    "LA Galaxy": "LAギャラクシー", "Inter Miami CF": "インテル・マイアミ", "Inter Miami": "インテル・マイアミ",
    "Los Angeles FC": "ロサンゼルスFC", "LAFC": "ロサンゼルスFC", "New York City FC": "ニューヨーク・シティ",
    "New York Red Bulls": "NYレッドブルズ", "Seattle Sounders FC": "シアトル・サウンダーズ", "Columbus Crew": "コロンバス・クルー",
    "FC Cincinnati": "FCシンシナティ", "Atlanta United FC": "アトランタ・ユナイテッド", "Toronto FC": "トロントFC",
    "Vancouver Whitecaps FC": "バンクーバー・W", "Portland Timbers": "ポートランド・ティンバーズ", "Orlando City SC": "オーランド・シティ",
    "Philadelphia Union": "フィラデルフィア・U", "New England Revolution": "ニューイングランド・R", "Chicago Fire FC": "シカゴ・ファイアー",
    "Sporting Kansas City": "スポルティングKC", "Real Salt Lake": "レアル・ソルトレイク", "Houston Dynamo FC": "ヒューストン・ダイナモ",
    "San Jose Earthquakes": "サンノゼ・アースクエイクス", "Colorado Rapids": "コロラド・ラピッズ", "FC Dallas": "FCダラス",
    "Minnesota United FC": "ミネソタ・ユナイテッド", "Austin FC": "オースティンFC", "Nashville SC": "ナッシュビルSC",
    "Charlotte FC": "シャーロットFC", "St. Louis City SC": "セントルイス・シティ", "CF Montréal": "CFモントリオール",
    "D.C. United": "DCユナイテッド", "DC United": "DCユナイテッド"
  };

  function translateTeam(name) {
    if (!name) return '';
    const trimmed = name.trim();
    return teamDictionary[trimmed] || trimmed;
  }

  // 元の全データ群
  const matches = [
    { tab: 'europe', gender: 'men', league: 'premier', kickoff: '2026-05-28T18:00:00', isJapan: true, playerName: '鎌田 大地', badge: 'プレミア', badgeColor: '#3b82f6', home: 'クリスタルパレス', away: 'ラージョ' },
    { tab: 'europe', gender: 'men', league: 'premier', kickoff: '2026-05-28T23:00:00', isJapan: true, playerName: '三笘 薫', badge: 'プレミア', badgeColor: '#3b82f6', home: 'ブライトン', away: 'チェルシー' },
    { tab: 'europe', gender: 'men', league: 'laliga', kickoff: '2026-05-29T01:30:00', isJapan: false, badge: 'ラ・リーガ', badgeColor: '#ef4444', home: 'レアル・マドリード', away: 'バルセロナ' },
    { tab: 'europe', gender: 'men', league: 'cl', kickoff: '2026-05-30T21:00:00', isJapan: false, badge: 'CL', badgeColor: '#1e3a8a', home: 'パリSG', away: 'アーセナル' },
    { tab: 'europe', gender: 'women', league: 'wsl', kickoff: '2026-05-29T02:00:00', isJapan: true, playerName: '長谷川 唯', badge: 'WSL', badgeColor: '#ec4899', home: 'マンチェスター・C', away: 'チェルシー' },
    { tab: 'match', gender: 'men', kickoff: '2026-06-05T19:30:00', isJapan: false, badge: 'W杯予選', badgeColor: '#059669', home: '日本', away: 'オーストラリア' },
    { tab: 'match', gender: 'women', kickoff: '2026-06-06T15:00:00', isJapan: false, badge: '親善試合', badgeColor: '#10b981', home: 'なでしこジャパン', away: 'アメリカ女子' },
    { tab: 'mideast', kickoff: '2026-05-29T03:00:00', league: 'saudi', badge: 'サウジ', badgeColor: '#047857', home: 'アル・ナスル', away: 'アル・ヒラル' },
    { tab: 'america', gender: 'men', league: 'mls', kickoff: '2026-05-29T08:30:00', isJapan: true, playerName: '吉田 麻也', badge: 'MLS', badgeColor: '#0284c7', home: 'LAギャラクシー', away: 'インテル・マイアミ' },
    { tab: 'youth', gender: 'men', kickoff: '2026-06-10T18:00:00', isJapan: false, badge: 'U-23', badgeColor: '#6d28d9', home: 'U-22日本', away: 'U-22韓国' }
  ];

  async function fetchExternalMatches() {
    try {
      const response = await fetch('data/schedule.json');
      const data = await response.json();
      loadedMatches = data.map(e => {
        const isoKickoff = e.date.replace(' ', 'T');
        const homeEng = e.match.split(' vs ')[0] || 'Home';
        const awayEng = e.match.split(' vs ')[1] || 'Away';
        
        return { 
          tab: 'america', 
          gender: 'men', 
          league: 'mls', 
          kickoff: isoKickoff, 
          isJapan: false, 
          badge: 'MLS', 
          badgeColor: '#0284c7', 
          home: translateTeam(homeEng), 
          away: translateTeam(awayEng) 
        };
      });
    } catch (e) {
      console.log("外部データ読み込みスキップ");
    }
  }

  function updateLeagueSelectOptions() {
    const select = document.getElementById('league-select');
    if(!select) return;
    let options = [];
    if (state.tab === 'mideast') {
      options = leagueOptions.mideast;
    } else if (leagueOptions[state.tab] && leagueOptions[state.tab][state.gender]) {
      options = leagueOptions[state.tab][state.gender];
    }
    select.innerHTML = options.map(o => `<option value="${o.val}">${o.text}</option>`).join('');
    select.value = state.league;
    if (!select.value) { select.value = 'all'; state.league = 'all'; }
  }

  function updateState(tab, updateHash = true) {
    state.tab = tab;
    if (updateHash) window.history.pushState(null, '', '#' + tab);

    state.gender = 'men';
    document.getElementById('men').classList.add('active');
    document.getElementById('women').classList.remove('active');
    
    // 1行にまとめたパーツをタブごとに非表示・表示切り替え
    document.getElementById('gender-ui').style.display = (tab === 'mideast') ? 'none' : '';
    document.getElementById('league-ui').style.display = (['match', 'youth'].includes(tab)) ? 'none' : '';
    document.getElementById('reset-ui').style.display = (['match', 'youth'].includes(tab)) ? 'none' : '';
    
    const tabNames = ['europe', 'japan', 'match', 'mideast', 'america', 'youth'];
    document.querySelectorAll('.category-tabs button').forEach((b, i) => {
      b.classList.toggle('active', tabNames[i] === tab);
    });

    updateLeagueSelectOptions();
    render();
  }

  function setGender(g) {
    state.gender = g;
    document.getElementById('men').classList.toggle('active', g === 'men');
    document.getElementById('women').classList.toggle('active', g === 'women');
    updateLeagueSelectOptions();
    render();
  }

  function resetFilters() {
    state.league = 'all';
    document.getElementById('league-select').value = 'all';
    render();
  }

  function getAdjustedDate(dateIso) {
    const d = new Date(dateIso);
    if (d.getHours() >= 0 && d.getHours() < 6) d.setDate(d.getDate() - 1);
    return d;
  }

  function formatGroupDate(dateIso) {
    const d = getAdjustedDate(dateIso);
    const day = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    const year = String(d.getFullYear()).slice(-2);
    return `${year}/${d.getMonth() + 1}/${String(d.getDate()).padStart(2, '0')}(${day})`;
  }

  function formatTime(dateIso) {
    const d = new Date(dateIso);
    let hours = d.getHours();
    const minutes = String(d.getMinutes()).padStart(2, '0');
    if (hours >= 0 && hours < 6) hours += 24;
    return `${hours}:${minutes}`;
  }

  async function render() {
    const area = document.getElementById('display-area');
    const selectEl = document.getElementById('league-select');
    state.league = selectEl ? (selectEl.value || 'all') : 'all';
    
    if (state.tab === 'america' && loadedMatches.length === 0) {
      await fetchExternalMatches();
    }

    let allSource = [...matches, ...loadedMatches];
    const now = new Date();

    allSource = allSource.filter(m => {
      const kickoffTime = new Date(m.kickoff);
      const expiryTime = new Date(kickoffTime.getTime() + 2 * 60 * 60 * 1000);
      return now <= expiryTime; 
    });

    allSource.sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff));

    let filtered = [];
    if (state.tab === 'japan') {
      filtered = allSource.filter(m => ['europe', 'america'].includes(m.tab) && m.gender === state.gender && m.isJapan === true);
    } else if (state.tab === 'mideast') {
      filtered = allSource.filter(m => m.tab === 'mideast');
    } else {
      filtered = allSource.filter(m => m.tab === state.tab && m.gender === state.gender);
    }

    if (state.league !== 'all' && !['match', 'youth'].includes(state.tab)) {
      filtered = filtered.filter(m => m.league === state.league);
    }

    const groupedMatches = {};
    filtered.forEach(m => {
      const dateStr = formatGroupDate(m.kickoff);
      if (!groupedMatches[dateStr]) groupedMatches[dateStr] = [];
      groupedMatches[dateStr].push(m);
    });

    let htmlOutput = '';
    const sortedDates = Object.keys(groupedMatches);

    if (sortedDates.length === 0) {
      area.innerHTML = '<p style="text-align:center; color:#475569; margin-top: 40px;">試合がありません</p>';
      return;
    }

    sortedDates.forEach(date => {
      const dayMatches = groupedMatches[date];
      htmlOutput += `<div class="date-header"><span>${date}</span><span class="match-count">${dayMatches.length}試合</span></div>`;
      dayMatches.forEach(m => {
        const isJapanClass = m.isJapan ? 'is-japan' : '';
        const playerTagHtml = (m.isJapan && m.playerName) ? `<div class="player-tag-wrapper"><span class="player-tag">${m.playerName}</span></div>` : '';
        htmlOutput += `
          <div class="match-card ${isJapanClass}">
            <div class="match-main">
              <div class="match-time">${formatTime(m.kickoff)}</div>
              <div class="match-badge" style="background-color: ${m.badgeColor || '#3b82f6'}">${m.badge}</div>
              <div class="match-teams"><span class="team home">${m.home}</span><span class="vs">vs</span><span class="team away">${m.away}</span></div>
            </div>
            ${playerTagHtml}
          </div>
        `;
      });
    });

    area.innerHTML = htmlOutput;
  }

  window.addEventListener('DOMContentLoaded', () => {
    const hash = window.location.hash.replace('#', '');
    const validTabs = ['europe', 'japan', 'match', 'mideast', 'america', 'youth'];
    if (hash && validTabs.includes(hash)) {
      updateState(hash, false);
    } else {
      updateState('europe', false);
    }
  });

  window.addEventListener('popstate', () => {
    const hash = window.location.hash.replace('#', '');
    const validTabs = ['europe', 'japan', 'match', 'mideast', 'america', 'youth'];
    updateState(validTabs.includes(hash) ? hash : 'europe', false);
  });
</script>
</body>
</html>
