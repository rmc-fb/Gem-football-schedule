<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>サッカー試合日程</title>
  <style>
    /* 既存のスタイルはそのまま維持してください */
    /* タイトルリンクのデフォルト下線を消すためのスタイルのみ追加 */
    .site-title a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>

  <!-- 1. 最上部のサイトタイトル（クリックでトップへ） -->
  <header>
    <h1 class="site-title">
      <a href="https://rmc-fb.github.io/Gem-football-schedule">⚽️ サッカー日程ナビ</a>
    </h1>
  </header>

  <!-- カテゴリ選択タブ（例） -->
  <div class="category-tabs">
    <button onclick="switchCategory('国内リーグ')">国内リーグ</button>
    <button onclick="switchCategory('代表戦日程')">代表戦日程</button>
    <button onclick="switchCategory('中東日程')">中東日程</button>
    <button onclick="switchCategory('ユース代表')">ユース代表</button>
  </div>

  <--- 条件によって非表示にするエリア --->
  
  <!-- 2. 男女切り替えタブ -->
  <div id="gender-tab-container">
    <!-- 男女切り替えのUI要素 -->
    <button>男子</button>
    <button>女子</button>
  </div>

  <!-- 3. リーグ選択 -->
  <div id="league-select-container">
    <!-- リーグ選択のUI要素（セレクトボックスやボタンなど） -->
    <select>
      <option>J1リーグ</option>
      <option>J2リーグ</option>
    </select>
  </div>

  <script>
    // カテゴリ切り替え時の表示・非表示ロジック
    function switchCategory(category) {
      const genderTab = document.getElementById('gender-tab-container');
      const leagueSelect = document.getElementById('league-select-container');

      // --- 男女切り替えタブの制御 ---
      // 「中東日程」のときは不要（非表示）
      if (category === '中東日程') {
        genderTab.style.display = 'none';
      } else {
        genderTab.style.display = 'block'; // 必要に応じて 'flex' などに変更してください
      }

      // --- リーグ選択の制御 ---
      // 「代表戦日程」「中東日程」「ユース代表」のときは不要（非表示）
      if (category === '代表戦日程' || category === '中東日程' || category === 'ユース代表') {
        leagueSelect.style.display = 'none';
      } else {
        leagueSelect.style.display = 'block';
      }

      // 実際のコンテンツ切り替え処理をここに記述
      console.log(category + 'を表示します');
    }

    // 初期表示の挙動（必要に応じて初期カテゴリを設定してください）
    switchCategory('国内リーグ');
  </script>
</body>
</html>
