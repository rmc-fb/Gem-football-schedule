<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    /* 完全に画像のデザインを再現したCSS */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #12192c; /* ディープネイビー背景 */
      color: #ffffff;
    }

    /* 最上部ヘッダー（サイトタイトル） */
    header {
      padding: 30px 20px 15px 20px;
      text-align: left;
      max-width: 500px;
      margin: 0 auto;
    }
    .site-title {
      margin: 0;
    }
    .site-title a {
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-subtitle {
      font-size: 11px;
      color: #727e96;
      margin-top: 4px;
      padding-left: 36px;
    }

    /* メインコンテナ */
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 16px 100px 16px;
    }

    /* カテゴリ選択グリッド（2段） */
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    .category-tabs button {
      background-color: #1a243d;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 12px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    /* アクティブなカテゴリ（画像の欧州日程のスタイル） */
    .category-tabs button.active {
      background-color: #222f4d;
      color: #ffffff;
      border-bottom: 2px solid #e11d48; /* 赤いアンダーライン */
    }

    /* 男女切り替えセクション */
    .gender-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    .section-label {
      font-size: 13px;
      color: #64748b;
    }
    .gender-tabs {
      display: flex;
      background-color: #1a243d;
      padding: 4px;
      border-radius: 20px;
    }
    .gender-tabs button {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    /* アクティブな性別ボタン（グラデーション赤） */
    .gender-tabs button.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
    }

    /* リーグ選択セクション */
    .league-section {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .select-wrapper {
      flex: 1;
      position: relative;
    }
    .select-wrapper select {
      width: 100%;
      background-color: #1a243d;
      border: 1px solid #2e3b5e;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      appearance: none;
      cursor: pointer;
    }
    .reset-btn {
      background-color: #1a243d;
      border: 1px solid #2e3b5e;
      color: #64748b;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 日程表示エリア */
    .date-group {
      margin-bottom: 20px;
    }
    .date-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      padding: 0 4px;
      font-weight: bold;
    }
    .match-card {
      background-color: #1a243d;
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .match-time {
      font-size: 15px;
      font-weight: bold;
      margin-right: 12px;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      margin-right: 12px;
      background-color: #d97706; /* UECLとかCLのバッジ背景色 */
      color: #fff;
    }
    .match-teams {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .vs {
      font-size: 11px;
      color: #64748b;
    }

    /* フッター */
    footer {
      text-align: center;
      font-size: 11px;
      color: #475569;
      line-height: 1.6;
      margin-top: 40px;
      padding: 0 20px;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="site-title">
      <a href="https://rmc-fb.github.io/Gem-football-schedule">
        <span style="font-size: 24px;">⚽</span> OVERSEAS FOOTBALL SCHEDULE
      </a>
    </h1>
    <div class="site-subtitle">海外サッカー 試合日程 － 日本人選手追跡</div>
  </header>

  <div class="container">
    <div class="category-tabs">
      <button class="active" onclick="switchCategory('欧州日程')">🌏 欧州日程</button>
      <button onclick="switchCategory('日本人日程')">🇯🇵 日本人日程</button>
      <button onclick="switchCategory('代表戦日程')">🏆 代表戦日程</button>
      <button onclick="switchCategory('中東日程')">🕌 中東日程</button>
      <button onclick="switchCategory('北米日程')">🌏 北米日程</button>
      <button onclick="switchCategory('ユース代表')">🌱 ユース代表</button>
    </div>

    <div class="gender-section" id="gender-tab-container">
      <div class="section-label">カテゴリ</div>
      <div class="gender-tabs">
        <button class="active" onclick="switchGender('men')">♂ 男子</button>
        <button onclick="switchGender('women')">♀ 女子</button>
      </div>
    </div>

    <div class="league-section" id="league-select-container">
      <div class="select-wrapper">
        <select>
          <option>🏟️ 全リーグ</option>
          <option>プレミアリーグ</option>
          <option>ラ・リーガ</option>
          <option>セリエA</option>
        </select>
      </div>
      <button class="reset-btn">リセット</button>
    </div>

    <div id="schedule-content">
      
      <div class="date-group">
        <div class="date-header">
          <span>2026/05/27(水)</span>
          <span>1試合</span>
        </div>
        <div class="match-card">
          <div class="match-time">28:00</div>
          <div class="badge" style="background-color: #b45309;">UECL</div>
          <div class="match-teams">
            <span>クリスタルパレス</span> 🦅 <span class="vs">vs</span> 🛡️ <span>ラージョ</span>
          </div>
        </div>
      </div>

      <div class="date-group">
        <div class="date-header">
          <span>2026/05/30(土)</span>
          <span>1試合</span>
        </div>
        <div class="match-card">
          <div class="match-time">25:00</div>
          <div class="badge" style="background-color: #1e3a8a;">CL</div>
          <div class="match-teams">
            <span>パリSG</span> 🗼 <span class="vs">vs</span> 🔴 <span>アーセナル</span>
          </div>
        </div>
      </div>

    </div>

    <footer>
      © 2026 海外サッカー日程 | データは参考情報です。正確な日程は各クラブ公式サイトでご確認ください。<br>
      Powered by football-data.org + GitHub Actions + GitHub Pages
    </footer>
  </div>

  <script>
    // 表示・非表示を切り替えるロジック
    function switchCategory(category) {
      // 全カテゴリボタンのハイライトをリセット
      const buttons = document.querySelectorAll('.category-tabs button');
      buttons.forEach(btn => {
        if (btn.innerText.includes(category)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const genderSection = document.getElementById('gender-tab-container');
      const leagueSection = document.getElementById('league-select-container');

      // 1. 「中東日程」に切り替えたら、男女切り替えタブ不要（非表示）
      if (category === '中東日程') {
        genderSection.style.display = 'none';
      } else {
        genderSection.style.display = 'flex';
      }

      // 2. 「代表戦日程」「中東日程」「ユース代表」に切り替えたらリーグ選択は不要（非表示）
      if (category === '代表戦日程' || category === '中東日程' || category === 'ユース代表') {
        leagueSection.style.display = 'none';
      } else {
        leagueSection.style.display = 'flex';
      }
    }

    // 男女タブの切り替え見た目
    function switchGender(gender) {
      const buttons = document.querySelectorAll('.gender-tabs button');
      if (gender === 'men') {
        buttons[0].classList.add('active');
        buttons[1].classList.remove('active');
      } else {
        buttons[0].classList.remove('active');
        buttons[1].classList.add('active');
      }
    }
  </script>
</body>
</html>
