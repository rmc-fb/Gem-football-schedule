<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #111625; color: #ffffff; }
    header { padding: 30px 20px 15px 20px; max-width: 500px; margin: 0 auto; }
    
    .site-title-container { display: flex; align-items: center; gap: 10px; }
    .site-title { margin: 0; font-size: 18px; font-weight: 800; }
    .site-title a { color: #ffffff; text-decoration: none; }
    .site-subtitle { margin: 4px 0 0 36px; color: #64748b; font-size: 12px; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 0 16px 50px; }
    
    /* 1行レイアウト調整 */
    .controls-row { display: flex; gap: 6px; margin-bottom: 16px; align-items: center; }
    .gender-tabs { display: flex; background: #161c2e; padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .gender-tabs button { background: none; border: none; color: #94a3b8; padding: 4px 8px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .gender-tabs button.active { background: #ef4444; color: #fff; border-radius: 2px; }
    
    select { flex: 1; background: #161c2e; border: 1px solid #232d45; color: #fff; padding: 5px; border-radius: 4px; font-size: 12px; min-width: 0; }
    .btn-reset { background: #161c2e; border: 1px solid #232d45; color: #475569; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    .match-card { background: #161c2e; border: 1px solid #1e263f; border-radius: 4px; padding: 6px 10px; margin-bottom: 4px; display: flex; align-items: center; font-size: 12px; }
    .match-time { font-weight: 700; width: 40px; }
    .match-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: #3b82f6; color: #fff; margin-right: 8px; }
    .match-teams { flex: 1; font-weight: 600; text-align: center; }
    
    footer { text-align: center; color: #475569; font-size: 10px; margin-top: 40px; padding: 20px 0; border-top: 1px solid #161c2e; }
  </style>
</head>
<body>

<header>
  <div class="site-title-container">
    <h1 class="site-title"><a href="#">OVERSEAS FOOTBALL SCHEDULE</a></h1>
  </div>
  <p class="site-subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
</header>

<div class="container">
  <div class="controls-row">
    <div class="gender-tabs">
      <button id="men" class="active" onclick="setGender('men')">男子</button>
      <button id="women" onclick="setGender('women')">女子</button>
    </div>
    <select id="league-select" onchange="render()">
      <option value="all">リーグ検索</option>
      <option value="mls">MLS</option>
      <option value="premier">プレミア</option>
    </select>
    <button class="btn-reset" onclick="resetFilters()">リセット</button>
  </div>

  <div id="display-area"></div>

  <footer>
    © 2026 データは参考情報です。正確な日程は各クラブ公式サイトでご確認ください。<br>
    Powered by Gemini + GitHub + Rapid API
  </footer>
</div>

<script>
  let state = { gender: 'men', league: 'all' };
  
  // テスト用データ（ここにデータを追加すれば表示されます）
  const matches = [
    { time: '08:30', league: 'mls', badge: 'MLS', home: 'LAギャラクシー', away: 'インテル・マイアミ' },
    { time: '18:00', league: 'premier', badge: 'プレミア', home: 'クリスタルパレス', away: 'ラージョ' }
  ];

  function setGender(g) {
    state.gender = g;
    document.getElementById('men').classList.toggle('active', g === 'men');
    document.getElementById('women').classList.toggle('active', g === 'women');
    render();
  }

  function resetFilters() {
    state.league = 'all';
    document.getElementById('league-select').value = 'all';
    render();
  }

  function render() {
    state.league = document.getElementById('league-select').value;
    const area = document.getElementById('display-area');
    
    // フィルタリング処理
    const filtered = matches.filter(m => state.league === 'all' || m.league === state.league);
    
    area.innerHTML = filtered.map(m => `
      <div class="match-card">
        <div class="match-time">${m.time}</div>
        <div class="match-badge">${m.badge}</div>
        <div class="match-teams">${m.home} vs ${m.away}</div>
      </div>
    `).join('');
  }

  window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
