<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外サッカー日程</title>
    <style>
        /* 全体のデザイン（元style.css） */
        body {
            background-color: #0f172a !important;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header-container {
            text-align: center;
            padding: 20px 0;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        .update-time {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-color: #38bdf8;
        }
        .match-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .match-time {
            color: #38bdf8;
            font-weight: bold;
            font-size: 1rem;
            width: 60px;
        }
        .match-teams {
            flex-grow: 1;
            text-align: center;
            font-weight: bold;
            padding: 0 10px;
        }
        .match-league {
            color: #94a3b8;
            font-size: 0.8rem;
            width: 100px;
            text-align: right;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>⚽ OVERSEAS FOOTBALL SCHEDULE</h1>
            <p class="subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
            <div class="update-time">更新: <strong id="update-date">—</strong> <span style="background: rgba(56,189,248,0.2); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">自動取得</span></div>
        </div>
    </header>

    <main>
        <div class="tabs-container">
            <button class="tab-btn active" data-tab="europe">🌍 欧州日程</button>
            <button class="tab-btn" data-tab="japanese">🇯🇵 日本人日程</button>
            <button class="tab-btn" data-tab="national">🏆 代表戦日程</button>
            <button class="tab-btn" data-tab="mid_east">🕌 中東日程</button>
        </div>

        <div id="match-list">
            <div style="text-align: center; padding: 40px; color: #94a3b8;">データを読み込み中...</div>
        </div>
    </main>

    <script>
        // データの制御（元script.js）
        document.addEventListener('DOMContentLoaded', () => {
            const tabBtns = document.querySelectorAll('.tab-btn');
            const matchList = document.getElementById('match-list');
            const updateDate = document.getElementById('update-date');

            // 今日・今の時間を表示
            const today = new Date();
            if (updateDate) {
                updateDate.textContent = today.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' }) + ' ' + today.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            }

            // 表示するダミーデータ
            const dummyData = {
                'europe': [
                    { time: '21:00', league: 'プレミア', home: 'アーセナル', away: 'マンチェスター・C' },
                    { time: '23:30', league: 'ラ・リーガ', home: 'レアル・マドリード', away: 'バルセロナ' }
                ],
                'japanese': [
                    { time: '20:00', league: 'プレミア', home: 'ブライトン (三笘)', away: 'リヴァプール (遠藤)' },
                    { time: '22:30', league: 'ブンデス', home: 'フライブルク (堂安)', away: 'バイエルン' }
                ],
                'national': [
                    { time: '19:30', league: 'W杯予選', home: '日本代表', away: 'オーストラリア' }
                ],
                'mid_east': [
                    { time: '02:00', league: 'サウジ', home: 'アル・ナスル', away: 'アル・ヒラル' }
                ]
            };

            function renderMatches(tabId) {
                if (!matchList) return;
                matchList.innerHTML = '';
                const matches = dummyData[tabId] || [];

                if (matches.length === 0) {
                    matchList.innerHTML = '<div style="text-align: center; padding: 20px; color: #94a3b8;">試合予定はありません。</div>';
                    return;
                }

                matches.forEach(match => {
                    const card = document.createElement('div');
                    card.className = 'match-card';
                    card.innerHTML = `
                        <div class="match-time">${match.time}</div>
                        <div class="match-teams">${match.home} vs ${match.away}</div>
                        <div class="match-league">${match.league}</div>
                    `;
                    matchList.appendChild(card);
                });
            }

            // 最初に「欧州日程」を表示
            renderMatches('europe');

            // タブの切り替えイベント
            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    tabBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    const tabId = e.target.getAttribute('data-tab');
                    renderMatches(tabId);
                });
            });
        });
    </script>
</body>
</html>
