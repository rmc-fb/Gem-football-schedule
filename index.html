<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #12192c;
      color: #ffffff;
    }
    header {
      padding: 30px 20px 15px 20px;
      text-align: left;
      max-width: 500px;
      margin: 0 auto;
    }
    .site-title {
      margin: 0;
    }
    .site-title a {
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-subtitle {
      font-size: 11px;
      color: #727e96;
      margin-top: 4px;
      padding-left: 36px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 16px 100px 16px;
    }
    
    /* カテゴリタブの隙間を少し詰めました */
    .category-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .category-tabs button {
      background-color: #1a243d;
      border: 1px solid transparent;
      color: #94a3b8;
      padding: 10px 4px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .category-tabs button.active {
      background-color: #222f4d;
      color: #ffffff;
      border-bottom: 2px solid #e11d48;
    }
    .gender-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .section-label {
      font-size: 13px;
      color: #64748b;
    }
    .gender-tabs {
      display: flex;
      background-color: #1a243d;
      padding: 4px;
      border-radius: 20px;
    }
    .gender-tabs button {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 6px 16px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .gender-tabs button.active {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: #ffffff;
    }
    .league-section {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
