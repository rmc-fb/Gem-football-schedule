<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #111625; color: #ffffff; }
    header { padding: 30px 20px 15px 20px; max-width: 500px; margin: 0 auto; text-align: left; }
    
    .site-title-container { display: flex; align-items: center; gap: 10px; }
    .site-logo-img { width: 26px; height: 26px; fill: #ffffff; flex-shrink: 0; }
    .site-title { margin: 0; font-size: 14px; font-weight: 800; white-space: nowrap; }
    .site-title a { color: #ffffff; text-decoration: none; }
    .site-subtitle { margin: 6px 0 0 36px; color: #64748b; font-size: 12px; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 0 16px 50px; }
    
    .category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 16px; }
    .category-tabs button { background: #161c2e; border: none; color: #94a3b8; padding: 6px 4px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .category-tabs button.active { background: #1e2942; color: #ffffff; border-bottom: 2px solid #ef4444; }
    
    .filter-row { display: flex; align-items: center; margin-bottom: 12px; font-size: 12px; gap: 8px; }
    .gender-tabs { display: flex; background: #161c2e; padding: 2px; border-radius: 4px; }
    .gender-tabs button { background: none; border: none; color: #94a3b8; padding: 4px 12px; border-radius: 2px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .gender-tabs button.active { background: #ef4444; color: #fff; }
    
    .league-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .league-controls select { flex: 1; background: #161c2e; border: 1px solid #232d45; color: #fff; padding: 6px; border-radius: 4px; font-size: 12px; }
    .btn-reset { background: #161c2e; border: 1px solid #232d45; color: #475569; padding: 0 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    .date-header { display: flex; justify-content: space-between; margin: 16px 0 6px 0; font-size: 12px; font-weight: 700; color: #ffffff; }
    
    .match-card { background: #161c2e; border: 1px solid #1e263f; border-radius: 4px; padding: 4px 8px; margin-bottom: 4px; display: flex; flex-direction: column; font-size: 11px; }
    .match-card.is-japan { border: 1px solid #3b82f6; }
    .match-main { display: flex; align-items: center; gap: 8px; }
    .match-time { font-weight: 700; width: 35px; }
    .match-badge { font-size: 9px; padding: 1px 4px; border-radius: 3px; background: #3b82f6; color: #fff; flex-shrink: 0; }
    .match-teams { flex: 1; display: flex; justify-content: center; gap: 4px; font-weight: 600; }
    
    footer { text-align: center; color: #475569; font-size: 10px; margin-top: 40px; padding: 20px 0; border-top: 1px solid #161c2e; line-height: 1.5; }
  </style>
</head>
<body>

<header>
  <div class="site-title-container">
    <svg class="site-logo-img" viewBox="0 0 512 512"><path d="M256 0C114.6 0 0 114.6 0 256s114.6 256 256 256 256-114.6 256-256S397.4 0 256 0zM358.5 220.8l-40.4 124.3H193.9l-40.4-124.3 98.4-71.5 106.6 71.5z"/></svg>
    <h1 class="site-title"><a href="#">OVERSEAS FOOTBALL SCHEDULE</a></h1>
  </div>
  <p class="site-subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
</header>

<div class="container">
  <div class="category-tabs" id="tabs">
    <button onclick="updateState('europe')">🌏 欧州</button>
    <button onclick="updateState('japan')">🇯🇵 日本人</button>
    <button onclick="updateState('match')">🏆 代表</button>
    <button onclick="updateState('mideast')">🕌 中東</button>
    <button onclick="updateState('america')">🌎 北米</button>
    <button onclick="updateState('youth')">🌱 ユース</button>
  </div>

  <div class="filter-row" id="gender-ui">
    <div class="gender-tabs">
      <button id="men" class="active" onclick="setGender('men')">♂ 男子</button>
      <button id="women" onclick="setGender('women')">♀ 女子</button>
    </div>
  </div>

  <div class="league-controls" id="league-ui">
    <select id="league-select" onchange="render()"><option value="all">リーグ検索</option></select>
    <button class="btn-reset" onclick="resetFilters()">リセット</button>
  </div>

  <div id="display-area"></div>

  <footer>
    © 2026 データは参考情報です。正確な日程は各クラブ公式サイトでご確認ください。<br>
    Powered by Gemini + GitHub + Rapid API
  </footer>
</div>

<script>
  let state = { tab: 'europe', gender: 'men', league: 'all' };
  const teamDictionary = { "LA Galaxy": "LAギャラクシー", "Inter Miami": "インテル・マイアミ" };

  function updateState(tab) {
    state.tab = tab;
    state.gender = 'men'; // タブ切り替えで常に男子
    document.querySelectorAll('.category-tabs button').forEach((b,i) => {
        b.classList.toggle('active', ['europe','japan','match','mideast','america','youth'][i] === tab);
    });
    document.getElementById('men').classList.add('active');
    document.getElementById('women').classList.remove('active');
    render();
  }

  function setGender(g) {
    state.gender = g;
    document.getElementById('men').classList.toggle('active', g === 'men');
    document.getElementById('women').classList.toggle('active', g === 'women');
    render();
  }

  function render() {
    // 試合データレンダリング処理
    const area = document.getElementById('display-area');
    area.innerHTML = `<div class="date-header">26/05/29(金)</div>
      <div class="match-card">
        <div class="match-main">
          <div class="match-time">08:30</div>
          <div class="match-badge">MLS</div>
          <div class="match-teams"><span>LAギャラクシー</span><span class="vs">vs</span><span>インテル・マイアミ</span></div>
        </div>
      </div>`;
  }
  
  window.addEventListener('DOMContentLoaded', () => render());
</script>
</body>
</html>
