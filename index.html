<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海外サッカー日程</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <header>
        <div class="header-container">
            <h1>⚽ OVERSEAS FOOTBALL SCHEDULE</h1>
            <p class="subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
            <div class="update-time">更新: <strong id="update-date">—</strong> <span style="background: rgba(56,189,248,0.2); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem;">自動取得</span></div>
        </div>
    </header>

    <main>
        <div class="tabs-container">
            <button class="tab-btn active" data-tab="europe">🌍 欧州日程</button>
            <button class="tab-btn" data-tab="japanese">🇯🇵 日本人日程</button>
            <button class="tab-btn" data-tab="national">🏆 代表戦日程</button>
            <button class="tab-btn" data-tab="mid_east">🕌 中東日程</button>
        </div>

        <div id="match-list">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>データを読み込み中...</p>
            </div>
        </div>
    </main>

    <script src="script.js?v=3"></script>
</body>
</html>
