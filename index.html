<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVERSEAS FOOTBALL SCHEDULE</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background-color: #111625; color: #ffffff; }
    header { padding: 30px 20px 15px 20px; max-width: 500px; margin: 0 auto; text-align: left; }
    
    /* ヘッダーデザイン */
    .site-title-container { display: flex; align-items: center; gap: 12px; }
    .site-logo { font-size: 32px; }
    .site-title { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
    .site-title a { color: #ffffff; text-decoration: none; }
    .site-subtitle { margin: 6px 0 0 0; color: #64748b; font-size: 13px; font-weight: 500; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 0 16px 50px; box-sizing: border-box; }
    
    /* 2行カテゴリタブ */
    .category-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .category-tabs button { background: #161c2e; border: none; color: #94a3b8; padding: 12px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; transition: all 0.2s; }
    .category-tabs button.active { background: #1e2942; color: #ffffff; border-bottom: 2px solid #ef4444; border-radius: 4px 4px 0 0; }
    
    /* フィルタセクション共通 */
    .filter-row { display: flex; align-items: center; margin-bottom: 14px; font-size: 13px; }
    .filter-label { color: #475569; font-weight: 600; width: 65px; shrink: 0; }
    
    /* 性別（カテゴリ）タブ */
    .gender-tabs { display: flex; background: #161c2e; padding: 3px; border-radius: 6px; }
    .gender-tabs button { background: none; border: none; color: #94a3b8; padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .gender-tabs button.active { background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; }
    
    /* リーグセレクト & リセット */
    .league-controls { flex: 1; display: flex; gap: 8px; }
    .league-controls select { flex: 1; background: #161c2e; border: 1px solid #232d45; color: #fff; padding: 10px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; outline: none; }
    .btn-reset { background: #161c2e; border: 1px solid #232d45; color: #475569; padding: 0 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; }
    
    /* 日付ヘッダー */
    .date-header { display: flex; justify-content: space-between; align-items: center; margin: 24px 0 8px 0; font-size: 14px; font-weight: 700; color: #ffffff; letter-spacing: 0.5px; }
    .match-count { color: #475569; font-size: 12px; font-weight: 500; }
    
    /* 試合カード */
    .match-card { background: #161c2e; border: 1px solid #1e263f; border-radius: 8px; padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; font-size: 13px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
    .match-time { font-weight: 700; width: 45px; color: #ffffff; font-size: 14px; }
    .match-badge { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; margin-right: 12px; text-align: center; min-width: 32px; color: #ffffff; }
    
    /* チーム対戦エリア */
    .match-teams { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; gap: 8px; }
    .team { display: flex; align-items: center; gap: 6px; }
    .team.home { justify-content: flex-end; flex: 1; text-align: right; }
    .team.away { justify-content: flex-start; flex: 1; text-align: left; }
    .team-logo { width: 18px; height: 18px; object-fit: contain; }
    .vs { color: #475569; font-size: 11px; font-weight: 500; margin: 0 4px; }
    
    /* フッター */
    footer { text-align: center; color: #334155; font-size: 11px; line-height: 1.6; margin-top: 40px; padding: 20px 0; border-top: 1px solid #161c2e; }
    footer a { color: #475569; text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="site-title-container">
    <span class="site-logo">⚽</span>
    <h1 class="site-title"><a href="https://rmc-fb.github.io/Gem-football-schedule">OVERSEAS FOOTBALL SCHEDULE</a></h1>
  </div>
  <p class="site-subtitle">海外サッカー 試合日程 — 日本人選手追跡</p>
</header>

<div class="container">
  <!-- 2行カテゴリタブ -->
  <div class="category-tabs" id="tabs">
    <button onclick="updateState('europe')">🌏 欧州日程</button>
    <button onclick="updateState('japan')">🇯🇵 日本人日程</button>
    <button onclick="updateState('match')">🏆 代表戦日程</button>
    <button onclick="updateState('mideast')">🕌 中東日程</button>
    <button onclick="updateState('america')">🌎 北米日程</button>
    <button onclick="updateState('youth')">🌱 ユース代表</button>
  </div>

  <!-- カテゴリ（性別）フィルタ -->
  <div class="filter-row" id="gender-ui">
    <div class="filter-label">カテゴリ</div>
    <div class="gender-tabs">
      <button id="men" class="active" onclick="setGender('men')">♂ 男子</button>
      <button id="women" onclick="setGender('women')">♀ 女子</button>
    </div>
  </div>

  <!-- リーグフィルタ -->
  <div class="filter-row" id="league-ui">
    <div class="filter-label">リーグ</div>
    <div class="league-controls">
      <select id="league-select" onchange="render()">
        <option value="all">🏟️ 全リーグ</option>
        <option value="premier">プレミアリーグ</option>
        <option value="mls">MLS</option>
      </select>
      <button class="btn-reset" onclick="resetFilters()">リセット</button>
    </div>
  </div>

  <!-- 試合スケジュール表示エリア -->
  <div id="display-area"></div>

  <!-- フッター -->
  <footer>
    <p>© 2025 海外サッカー日程 | データは参考情報です。正確な日程は各クラブ公式サイトでご確認ください。</p>
    <p>Powered by <a href="https://www.football-data.org/" target="_blank">football-data.org</a> + GitHub Actions + GitHub Pages</p>
  </footer>
</div>

<script>
  let state = { tab: 'europe', gender: 'men', league: 'all' };
  let loadedMatches = [];

  // 初期表示用のモックデータ（image.pngの再現用）
  const matches = [
    { tab: 'europe', gender: 'men', league: 'premier', date: '2026/05/27(水)', time: '28:00', badge: 'UECL', badgeColor: '#b45309', home: 'クリスタルパレス', homeLogo: 'https://media.sportal.co.nz/rounds/logos/crystal_palace.png', away: 'ラージョ', awayLogo: '' },
    { tab: 'europe', gender: 'men', league: 'premier', date: '2026/05/30(土)', time: '25:00', badge: 'CL', badgeColor: '#1e3a8a', home: 'パリSG', homeLogo: '', away: 'アーセナル', awayLogo: '' }
  ];

  // 外部MLSデータの読み込みと加工
  async function fetchExternalMatches() {
    try {
      const response = await fetch('data/schedule.json');
      const data = await response.json();
      
      // 取得した292件のデータを新しいUIの構造（日付グループ化対応）にマッピング
      loadedMatches = data.map(e => {
        const dateObj = new Date(e.date.replace(/-/g, '/'));
        const dayOfWeek = ['日', '月', '火', '水', '木', '金', '土'][dateObj.getDay()];
        const dateStr = `${dateObj.getFullYear()}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}(${dayOfWeek})`;
        const timeStr = e.date.split(' ')[1]?.substring(0, 5) || '00:00';
        const teams = e.match.split(' vs ');

        return {
          tab: 'america',
          gender: 'men',
          league: 'mls',
          date: dateStr,
          time: timeStr,
          badge: 'MLS',
          badgeColor: '#0284c7',
          home: teams[0] || 'Home',
          homeLogo: '',
          away: teams[1] || 'Away',
          awayLogo: ''
        };
      });
    } catch (e) {
      console.log("北米データ読み込み失敗", e);
    }
  }

  function updateState(tab) {
    state.tab = tab;
    // 特定のタブにおけるUIの表示切り替え制御
    document.getElementById('gender-ui').style.display = (tab === 'mideast') ? 'none' : 'flex';
    document.getElementById('league-ui').style.display = (['match', 'mideast', 'youth'].includes(tab)) ? 'none' : 'flex';
    
    const tabNames = ['europe', 'japan', 'match', 'mideast', 'america', 'youth'];
    document.querySelectorAll('.category-tabs button').forEach((b, i) => {
      b.classList.toggle('active', tabNames[i] === tab);
    });
    render();
  }

  function setGender(g) {
    state.gender = g;
    document.getElementById('men').classList.toggle('active', g === 'men');
    document.getElementById('women').classList.toggle('active', g === 'women');
    render();
  }

  function resetFilters() {
    document.getElementById('league-select').value = 'all';
    render();
  }

  async function render() {
    const area = document.getElementById('display-area');
    const selectedLeague = document.getElementById('league-select').value;
    
    if (state.tab === 'america' && loadedMatches.length === 0) {
      await fetchExternalMatches();
    }

    // フィルタリング処理
    let filtered = (state.tab === 'america') ? loadedMatches : matches.filter(m => m.tab === state.tab && m.gender === state.gender);
    if (selectedLeague !== 'all' && state.tab !== 'america') {
      filtered = filtered.filter(m => m.league === selectedLeague);
    }

    // 日付ごとにデータをグループ化
    const groupedMatches = {};
    filtered.forEach(m => {
      if (!groupedMatches[m.date]) {
        groupedMatches[m.date] = [];
      }
      groupedMatches[m.date].push(m);
    });

    // HTMLの構築（日付ヘッダー + 試合カード）
    let htmlOutput = '';
    const sortedDates = Object.keys(groupedMatches);

    if (sortedDates.length === 0) {
      area.innerHTML = '<p style="text-align:center; color:#475569; margin-top: 40px;">試合がありません</p>';
      return;
    }

    sortedDates.forEach(date => {
      const dayMatches = groupedMatches[date];
      htmlOutput += `
        <div class="date-header">
          <span>${date}</span>
          <span class="match-count">${dayMatches.length}試合</span>
        </div>
      `;

      dayMatches.forEach(m => {
        htmlOutput += `
          <div class="match-card">
            <div class="match-time">${m.time}</div>
            <div class="match-badge" style="background-color: ${m.badgeColor}">${m.badge}</div>
            <div class="match-teams">
              <span class="team home">
                ${m.home} 
                ${m.homeLogo ? `<img src="${m.homeLogo}" class="team-logo" onerror="this.style.display='none'">` : ''}
              </span>
              <span class="vs">vs</span>
              <span class="team away">
                ${m.awayLogo ? `<img src="${m.awayLogo}" class="team-logo" onerror="this.style.display='none'">` : ''}
                ${m.away}
              </span>
            </div>
          </div>
        `;
      });
    });

    area.innerHTML = htmlOutput;
  }

  // 初期起動
  updateState('europe');
</script>
</body>
</html>
